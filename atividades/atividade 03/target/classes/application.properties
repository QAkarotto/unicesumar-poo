# Caminho do arquivo SQLite (relativo a pasta de onde a aplicacao e executada: raiz do projeto)
sistemaacademico.banco.caminho=database/sistema-academico.db
# Scripts SQL fornecidos pelo projeto
sistemaacademico.banco.schema=database/schema.sql
sistemaacademico.banco.dados-iniciais=database/dados-iniciais.sql
# Executa schema.sql e dados-iniciais.sql ao subir (ambos idempotentes)
sistemaacademico.banco.inicializar=true
