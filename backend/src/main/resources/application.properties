spring.application.name=aniva-backend
server.port=8080

# Banco de dados (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aniva?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:aniva}
spring.datasource.password=${DB_PASSWORD:Senha123}

#  JPA
# O banco é criado pelo database/schema.sql, então o Hibernate não mexe nas tabelas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

#  schema.sql e data.sql
# Executados na inicialização (são idempotentes: CREATE TABLE IF NOT EXISTS e INSERT IGNORE).
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

#  JSON
# Campos sem valor (ex.: episodes de um mangá) não são enviados ao frontend.
spring.jackson.default-property-inclusion=non_null

#  Sessão (cookie)
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
