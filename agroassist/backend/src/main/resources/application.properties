spring.application.name=agroassist
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agroassist}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:agroassist}
spring.datasource.password=${DB_PASSWORD:agroassist_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.sql.init.mode=never

server.error.include-message=never
spring.jackson.deserialization.accept-float-as-int=false

agroassist.demo.enabled=${DEMO_ENABLED:true}
