name: Atividade 06 - Testes Unitários

on:
  push:
    paths:
      - "src/Atividade 6/**"
  pull_request:
    paths:
      - "src/Atividade 6/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Atividade 6
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Executar testes com Maven
        run: mvn -B test verify
