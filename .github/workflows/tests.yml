name: Java Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/academico

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
          cache-dependency-path: projects/academico/pom.xml

      - name: Prepare SQLite database
        run: |
          sudo apt-get install -y sqlite3
          sqlite3 database/sistema-academico.db ".read database/schema.sql"
          sqlite3 database/sistema-academico.db ".read database/dados-iniciais.sql"

      - name: Run tests
        run: mvn --batch-mode clean test

      - name: Check coverage
        run: mvn --batch-mode verify -DskipTests
