spring.application.name=controle-estoque

# Padrao local: H2 em arquivo (database/controle_estoque.mv.db), compativel com o schema MySQL
# Para usar o MySQL: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./database/controle_estoque;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# No H2 o Hibernate cria as tabelas; no MySQL a estrutura vem de database/schema.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
