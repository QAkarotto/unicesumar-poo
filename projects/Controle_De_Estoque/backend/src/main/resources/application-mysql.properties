# Ative com: --spring.profiles.active=mysql
# Usuario e senha vem de variaveis de ambiente (nenhuma credencial fica no repositorio)

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/controle_estoque}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# A estrutura do banco vem de database/schema.sql, o Hibernate nao altera tabelas
spring.jpa.hibernate.ddl-auto=none
