spring.application.name=loja-jogos

# Conexao com o MySQL.
# Usuario e senha vem de variaveis de ambiente (DB_USER e DB_PASSWORD),
# para nao colocar senha real no repositorio. Se DB_USER nao existir, usa "root".
spring.datasource.url=jdbc:mysql://localhost:3306/loja_jogos
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# A estrutura do banco vem do database/schema.sql, entao o Hibernate NAO cria nem altera tabelas.
spring.jpa.hibernate.ddl-auto=none

# Mostra no console o SQL que o Hibernate gera (bom para a apresentacao).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Fecha a sessao do JPA quando o Service termina (o Controller so trabalha com DTOs).
spring.jpa.open-in-view=false