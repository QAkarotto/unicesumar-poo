# ===================================================================
# Configuração de Banco de Dados Relacional
# Atividade Final - 2BIM: Sistema Acadêmico Full Stack
# ===================================================================

# Padrão: H2 Database em modo de compatibilidade MySQL com persistência em arquivo
# Permite executar a aplicação imediatamente sem depender de um daemon externo ativo.
spring.datasource.url=jdbc:h2:file:./database/sistema_academico_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Porta do Servidor Web
server.port=8080
