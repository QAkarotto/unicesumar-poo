# ===================================================================
# Configuração para Testes Automatizados (H2 em modo MySQL)
# Permite execução rápida e isolada em qualquer máquina e no CI do GitHub
# ===================================================================

spring.datasource.url=jdbc:h2:mem:sistema_academico;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
