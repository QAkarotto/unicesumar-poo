spring.application.name=controle-estoque
server.port=8080

# ---------------------------------------------------------------
# Conexão com o MySQL
# Usuário e senha vêm de variáveis de ambiente (DB_USERNAME / DB_PASSWORD).
# Os valores padrão abaixo são apenas para o ambiente LOCAL de desenvolvimento
# (os mesmos do docker-compose.yml). Não use senhas reais aqui.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/controle_estoque?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:estoque_app}
spring.datasource.password=${DB_PASSWORD:estoque_dev}

# ---------------------------------------------------------------
# JPA / Hibernate
# A estrutura do banco é criada pelo database/schema.sql (modelagem própria),
# por isso o Hibernate NÃO gera nem altera tabelas (ddl-auto=none).
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Origem do frontend React liberada no CORS
app.cors.origens=http://localhost:5173
