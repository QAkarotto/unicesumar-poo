# Testes usam H2 em memória no modo de compatibilidade com MySQL
# e executam o MESMO database/schema.sql do projeto (valida a modelagem).
spring.datasource.url=jdbc:h2:mem:estoque_teste;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:../database/schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.cors.origens=http://localhost:5173
